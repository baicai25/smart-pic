server:
  port: 8088
  servlet:
    context-path: /api
    # cookie 30 天后过期
    session:
      cookie:
        max-age: 2592000
spring:
  application:
    name: smart-picture
  #数据库配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/smart_pic #3306/后面的这个是架构(数据库)的名字
    username: root
    password: 1234
  #redis 配置
  redis:
    database: 1
    host: 127.0.0.1
    port: 6379
    connect-timeout: 5000
    password: 123456
  #Session 配置
  session:
    store-type: redis
    # 过期时间30天
    timeout: 2592000
  #  更大的图片上传体积(默认1MB
  servlet:
    multipart:
      max-file-size: 5MB
  # 空间图片分表
  shardingsphere:
    datasource:
      names: smart_pic
      smart_pic:
        type: com.zaxxer.hikari.HikariDataSource
        driver-class-name: com.mysql.cj.jdbc.Driver
        url: jdbc:mysql://localhost:3306/smart_pic
        username: root
        password: 1234
    rules:
      sharding:
        tables:
          picture:
            actual-data-nodes: smart_pic.picture # 动态分表
            table-strategy:
              standard:
                sharding-column: spaceId
                sharding-algorithm-name: picture_sharding_algorithm  # 使用自定义分片算法
        sharding-algorithms:
          picture_sharding_algorithm:
            type: CLASS_BASED
            props:
              strategy: standard
              algorithmClassName: org.baicai.smart.manager.sharding.PictureShardingAlgorithm
    props:
      sql-show: true
#  profiles:
#    active: local
mybatis-plus:
  configuration:
    # MyBatis 配置
    map-underscore-to-camel-case: false
    #仅在开发环境打印日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    enable-sql-runner: true
    # 全局配置
    db-config:
      logic-delete-field: isDelete #全局逻辑删除的实体字段名
      logic-delete-value: 1 #逻辑已删除值
      logic-not-delete-value: 0 #逻辑未删除

knife4j:
  enable: true
  openapi:
    title: Knife4j我的文档
    version: v1.0
    group:
      test1:
        api-rule: package
        api-rule-resources:
          - org.baicai.smart.controller
